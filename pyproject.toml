[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnsyn"
version = "2.0.0"
description = "Query tools for Chinese Synonyms (lexical recall)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ShangFR", email = "shangfr@foxmail.com" }]
keywords = ["NLP", "Chinese", "synonyms", "simwords", "lexical"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3"]
pinyin = ["pypinyin>=0.48"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/shangfr/Chinese-Synonyms"

[project.scripts]
cnsyn = "cnsyn.__main__:main"

[tool.setuptools]
packages = ["cnsyn"]

[tool.setuptools.package-data]
cnsyn = ["chinese_dictionary/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]